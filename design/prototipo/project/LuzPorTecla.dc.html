<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Luz por tecla</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&amp;display=swap">
<style>
body{margin:0}
a{color:#2647C9}a:hover{color:#1A3396}
button,input{font-family:inherit}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid #2647C9;outline-offset:2px}
</style>
</helmet>
<div style="width: 1120px; height: 760px; box-sizing: border-box; padding: 24px 40px; display: flex; flex-direction: column; gap: 18px; background: #E4E6E3; color: #1F2328; font-family: 'Archivo', 'Segoe UI', sans-serif; font-size: 14px; line-height: 1.45">

<header style="display: flex; justify-content: space-between; align-items: flex-end; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 4px">
<a href="Teclado.dc.html" style="display: flex; align-items: center; min-height: 32px; font-weight: 600; color: #1F2328; text-decoration: none">← Teclado</a>
<h1 style="margin: 0; font-size: 40px; line-height: 1; font-weight: 700; font-stretch: 75%">Luz por tecla</h1>
<span style="color: #5B6168">Escolha uma cor embaixo e clique nas teclas para pintar.</span>
</div>
<div role="radiogroup" aria-label="Ferramenta" style="display: flex; gap: 4px; background: #D6D9D5; border-radius: 10px; padding: 4px">
<sc-for list="{{tools}}" as="t" hint-placeholder-count="2">
<button role="radio" aria-checked="{{t.on}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
</sc-for>
</div>
</header>

<section aria-label="Teclado para pintar" style="display: flex; justify-content: center">
<div style="{{caseStyle}}">
<sc-for list="{{keys}}" as="k" hint-placeholder-count="108">
<button onClick="{{k.pick}}" aria-label="{{k.aria}}" style="{{k.style}}">{{k.label}}</button>
</sc-for>
<span aria-hidden="true" style="{{knob.style}}"><span style="{{knob.inner}}"></span></span>
</div>
</section>

<div style="display: flex; gap: 18px; flex-grow: 1; min-height: 0">
<section style="flex-grow: 1; min-width: 0; background: #F5F6F4; border-radius: 14px; padding: 16px 20px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 14px">
<span aria-hidden="true" style="{{bigSwatch}}"></span>
<span style="display: flex; flex-direction: column"><b style="font-weight: 600">Cor do pincel</b><span style="font-size: 13px; color: #5B6168; font-variant-numeric: tabular-nums">{{brushHex}}</span></span>
<label style="margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 13px; color: #5B6168">Código
<input value="{{brushHex}}" aria-label="Código da cor (hexadecimal)" style="width: 96px; min-height: 36px; box-sizing: border-box; border: 1px solid #C6CAC6; border-radius: 8px; padding: 0 10px; font-variant-numeric: tabular-nums; color: #1F2328; background: #FFFFFF"></label>
</div>
<div style="display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{palette}}" as="p" hint-placeholder-count="12">
<button onClick="{{p.pick}}" aria-label="{{p.aria}}" style="{{p.style}}"></button>
</sc-for>
</div>
</section>
<section style="width: 300px; flex-shrink: 0; background: #F5F6F4; border-radius: 14px; padding: 16px 20px; display: flex; flex-direction: column; gap: 8px">
<b style="font-weight: 600">Atalhos</b>
<button onClick="{{fillAll}}" style="min-height: 40px; border: 1px solid #C6CAC6; background: #FFFFFF; border-radius: 9px; cursor: pointer; text-align: left; padding: 0 12px">Pintar todas com esta cor</button>
<button onClick="{{wasd}}" style="min-height: 40px; border: 1px solid #C6CAC6; background: #FFFFFF; border-radius: 9px; cursor: pointer; text-align: left; padding: 0 12px">Destacar WASD e setas</button>
<button onClick="{{clearAll}}" style="min-height: 40px; border: 1px solid #C6CAC6; background: #FFFFFF; border-radius: 9px; cursor: pointer; text-align: left; padding: 0 12px">Apagar todas</button>
</section>
</div>

<footer style="display: flex; justify-content: space-between; align-items: center; gap: 12px">
<span style="font-size: 12px; color: #5B6168; max-width: 560px">Gravar liga o efeito "Por tecla". O teclado não devolve as cores, então o app guarda uma cópia no PC.</span>
<span style="display: flex; gap: 8px">
<a href="Teclado.dc.html" style="display: flex; align-items: center; border: 1px solid #C6CAC6; background: #FFFFFF; border-radius: 10px; padding: 0 16px; min-height: 44px; color: #1F2328; text-decoration: none">Cancelar</a>
<a href="Teclado.dc.html" style="display: flex; align-items: center; border: 0; background: #2647C9; border-radius: 10px; padding: 0 18px; min-height: 44px; color: #FFFFFF; font-weight: 600; text-decoration: none">Gravar no teclado</a>
</span>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1120,"height":760}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tool: 'pintar', brush: '#FF8800', colors: null };
  }
  renderVals() {
    const s = this.state;
    const P = 44, GAP = 4, PAD = 14;
    const NAV = 15.25, NUM = 16.5;
    const Y = [0, 1.3, 2.3, 3.3, 4.3, 5.3];
    const L = [];
    const put = (label, x, r, w = 1, h = 1, name) => L.push({ label, x, r, w, h, name: name || label });
    // fileira das F
    put('Esc', 0, 0);
    ['F1', 'F2', 'F3', 'F4'].forEach((k, i) => put(k, 2 + i, 0));
    ['F5', 'F6', 'F7', 'F8'].forEach((k, i) => put(k, 6.5 + i, 0));
    ['F9', 'F10', 'F11', 'F12'].forEach((k, i) => put(k, 11 + i, 0));
    put('Del', NAV, 0, 1, 1, 'Delete'); put('Scroll', NUM, 0, 1, 1, 'Scroll Lock'); put('Calc', NUM + 1, 0, 1, 1, 'Calculadora');
    // números
    ['`', '1', '2', '3', '4', '5', '6', '7', '8', '9', '0', '-', '='].forEach((k, i) => put(k, i, 1));
    put('Backspace', 13, 1, 2); put('Home', NAV, 1);
    put('Num', NUM, 1, 1, 1, 'Num Lock'); put('/', NUM + 1, 1, 1, 1, 'Num /'); put('*', NUM + 2, 1, 1, 1, 'Num *'); put('−', NUM + 3, 1, 1, 1, 'Num −');
    // Q
    put('Tab', 0, 2, 1.5);
    ['Q', 'W', 'E', 'R', 'T', 'Y', 'U', 'I', 'O', 'P', '[', ']'].forEach((k, i) => put(k, 1.5 + i, 2));
    put('\\', 13.5, 2, 1.5); put('PgUp', NAV, 2);
    ['7', '8', '9'].forEach((k, i) => put(k, NUM + i, 2, 1, 1, 'Num ' + k)); put('+', NUM + 3, 2, 1, 2, 'Num +');
    // A
    put('Caps', 0, 3, 1.75, 1, 'Caps Lock');
    ['A', 'S', 'D', 'F', 'G', 'H', 'J', 'K', 'L', ';', "'"].forEach((k, i) => put(k, 1.75 + i, 3));
    put('Enter', 12.75, 3, 2.25); put('PgDn', NAV, 3);
    ['4', '5', '6'].forEach((k, i) => put(k, NUM + i, 3, 1, 1, 'Num ' + k));
    // Z
    put('Shift', 0, 4, 2.25, 1, 'Shift esquerdo');
    ['Z', 'X', 'C', 'V', 'B', 'N', 'M', ',', '.', '/'].forEach((k, i) => put(k, 2.25 + i, 4));
    put('Shift', 12.25, 4, 1.75, 1, 'Shift direito'); put('↑', 14.25, 4, 1, 1, 'Seta para cima');
    ['1', '2', '3'].forEach((k, i) => put(k, NUM + i, 4, 1, 1, 'Num ' + k)); put('Enter', NUM + 3, 4, 1, 2, 'Enter do numérico');
    // espaço
    put('Ctrl', 0, 5, 1.25); put('Win', 1.25, 5, 1.25); put('Alt', 2.5, 5, 1.25, 1, 'Alt esquerdo');
    put('', 3.75, 5, 6.25, 1, 'Espaço'); put('Alt', 10, 5, 1, 1, 'Alt direito'); put('Fn', 11, 5, 1.25);
    put('←', 13.25, 5, 1, 1, 'Seta para a esquerda'); put('↓', 14.25, 5, 1, 1, 'Seta para baixo'); put('→', NAV, 5, 1, 1, 'Seta para a direita');
    put('0', NUM, 5, 2, 1, 'Num 0'); put('.', NUM + 2, 5, 1, 1, 'Num .');
    const BASE = '#9B4DFF';
    const DESTAQUE = ['W', 'A', 'S', 'D', 'Seta para cima', 'Seta para baixo', 'Seta para a esquerda', 'Seta para a direita'];
    const inicial = () => L.map((k) => (DESTAQUE.includes(k.name) ? '#FF8800' : BASE));
    const colors = s.colors || inicial();
    const caps = ['#D9DAD3', '#C4C7C2', '#A2A7A5', '#7A8180', '#5A6162', '#454A4D'];
    const ink = ['#5B5F63', '#575C60', '#3E4347', '#E6E8E6', '#E6E8E6', '#E6E8E6'];
    const W = 20.5;
    const keys = L.map((k, i) => {
      const c = colors[i];
      const off = c === '#000000';
      const left = PAD + Math.round(k.x * P), top = PAD + Math.round(Y[k.r] * P);
      const w = Math.round(k.w * P) - GAP, h = Math.round(k.h * P) - GAP;
      return {
        label: k.label,
        aria: k.name + ': ' + (off ? 'apagada' : c) + '. Clique para ' + (s.tool === 'apagar' ? 'apagar' : 'pintar com ' + s.brush),
        pick: () => { const n = colors.slice(); n[i] = s.tool === 'apagar' ? '#000000' : s.brush; this.setState({ colors: n }); },
        style: 'position: absolute; left: ' + left + 'px; top: ' + top + 'px; width: ' + w + 'px; height: ' + h + 'px; box-sizing: border-box; padding: 3px 5px; display: flex; align-items: flex-end; justify-content: ' + (k.w > 1.4 ? 'flex-start' : 'center') + '; border: 0; border-radius: 6px; cursor: pointer; font-size: ' + (k.label.length > 3 ? 10 : 11) + 'px; font-weight: 600; letter-spacing: 0.02em; text-transform: uppercase; background: linear-gradient(180deg, rgba(255,255,255,0.10), rgba(0,0,0,0.10)), ' + caps[k.r] + '; color: ' + (off ? ink[k.r] : 'color-mix(in srgb, ' + c + ' 85%, ' + ink[k.r] + ')') + '; box-shadow: ' + (off ? 'none' : '0 0 0 2px color-mix(in srgb, ' + c + ' 85%, transparent), 0 3px 10px color-mix(in srgb, ' + c + ' 70%, transparent)') + ', inset 0 -3px 0 rgba(0,0,0,0.22)'
      };
    });
    const cw = PAD * 2 + Math.round(W * P) - GAP, ch = PAD * 2 + Math.round(6.3 * P) - GAP;
    const kd = Math.round(1.3 * P);
    const opts = [['#FF0000', 'Vermelho'], ['#FF8800', 'Laranja'], ['#FFD400', 'Amarelo'], ['#7CFF00', 'Verde-limão'], ['#00FF00', 'Verde'], ['#00FFB0', 'Verde-água'], ['#00FFFF', 'Ciano'], ['#0080FF', 'Azul-claro'], ['#0000FF', 'Azul'], ['#9B4DFF', 'Roxo'], ['#FF00FF', 'Magenta'], ['#FFFFFF', 'Branco']];
    const palette = opts.map(([hex, name]) => {
      const on = s.brush === hex && s.tool === 'pintar';
      return {
        aria: name, pick: () => this.setState({ brush: hex, tool: 'pintar' }),
        style: 'height: 34px; border-radius: 8px; cursor: pointer; padding: 0; background: ' + hex + '; border: 1px solid #A9AEA9; box-shadow: ' + (on ? '0 0 0 2px #F5F6F4, 0 0 0 4px #1F2328' : 'none')
      };
    });
    const tools = [['pintar', 'Pintar'], ['apagar', 'Apagar']].map(([id, label]) => {
      const on = s.tool === id;
      return { label, on: on ? 'true' : 'false', pick: () => this.setState({ tool: id }), style: 'min-height: 36px; padding: 0 18px; border: 0; border-radius: 7px; cursor: pointer; font-size: 14px; font-weight: ' + (on ? 600 : 400) + '; background: ' + (on ? '#FFFFFF' : 'transparent') + '; color: ' + (on ? '#1F2328' : '#3E444B') };
    });
    return {
      keys, tools, palette,
      caseStyle: 'position: relative; width: ' + cw + 'px; height: ' + ch + 'px; border-radius: 14px; background: linear-gradient(180deg, #24272B, #15171A); box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 10px 24px rgba(31,35,40,0.28)',
      knob: {
        style: 'position: absolute; display: block; left: ' + (PAD + Math.round((NUM + 2.4) * P)) + 'px; top: ' + (PAD - 6) + 'px; width: ' + kd + 'px; height: ' + kd + 'px; border-radius: 50%; background: conic-gradient(from 200deg, #F2F3F1, #9DA1A3, #E8E9E6, #8C9093, #F2F3F1); box-shadow: 0 2px 6px rgba(0,0,0,0.5)',
        inner: 'display: block; margin: 7px; height: ' + (kd - 14) + 'px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #3A3E42, #121416)'
      },
      brushHex: s.tool === 'apagar' ? 'Apagar' : s.brush,
      bigSwatch: 'width: 44px; height: 44px; border-radius: 10px; border: 1px solid #A9AEA9; background: ' + (s.tool === 'apagar' ? 'repeating-linear-gradient(45deg, #FFFFFF 0 6px, #D6D9D5 6px 12px)' : s.brush),
      fillAll: () => this.setState({ colors: L.map(() => s.brush), tool: 'pintar' }),
      wasd: () => this.setState({ colors: L.map((k, i) => (DESTAQUE.includes(k.name) ? s.brush : colors[i])) }),
      clearAll: () => this.setState({ colors: L.map(() => '#000000') })
    };
  }
}
</script>
</body>
</html>
