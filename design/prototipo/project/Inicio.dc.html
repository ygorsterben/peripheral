<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1120,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    // mesmo layout do desenho da tela do teclado, em miniatura e sem legendas
    const P = 21, GAP = 2, PAD = 10;
    const NAV = 15.25, NUM = 16.5;
    const Y = [0, 1.3, 2.3, 3.3, 4.3, 5.3];
    const L = [];
    const put = (x, r, w = 1, h = 1) => L.push({ x, r, w, h });
    put(0, 0);
    [2, 3, 4, 5, 6.5, 7.5, 8.5, 9.5, 11, 12, 13, 14, NAV, NUM, NUM + 1].forEach((x) => put(x, 0));
    for (let i = 0; i < 13; i++) put(i, 1);
    put(13, 1, 2); put(NAV, 1); [0, 1, 2, 3].forEach((i) => put(NUM + i, 1));
    put(0, 2, 1.5); for (let i = 0; i < 12; i++) put(1.5 + i, 2);
    put(13.5, 2, 1.5); put(NAV, 2); [0, 1, 2].forEach((i) => put(NUM + i, 2)); put(NUM + 3, 2, 1, 2);
    put(0, 3, 1.75); for (let i = 0; i < 11; i++) put(1.75 + i, 3);
    put(12.75, 3, 2.25); put(NAV, 3); [0, 1, 2].forEach((i) => put(NUM + i, 3));
    put(0, 4, 2.25); for (let i = 0; i < 10; i++) put(2.25 + i, 4);
    put(12.25, 4, 1.75); put(14.25, 4); [0, 1, 2].forEach((i) => put(NUM + i, 4)); put(NUM + 3, 4, 1, 2);
    put(0, 5, 1.25); put(1.25, 5, 1.25); put(2.5, 5, 1.25); put(3.75, 5, 6.25); put(10, 5); put(11, 5, 1.25);
    put(13.25, 5); put(14.25, 5); put(NAV, 5); put(NUM, 5, 2); put(NUM + 2, 5);
    const caps = ['#D9DAD3', '#C4C7C2', '#A2A7A5', '#7A8180', '#5A6162', '#454A4D'];
    const W = 20.5;
    const keys = L.map((k) => {
      const c = 'hsl(' + Math.round((k.x + k.w / 2) / W * 300) + ' 90% 62%)';
      return {
        style: 'position: absolute; left: ' + (PAD + Math.round(k.x * P)) + 'px; top: ' + (PAD + Math.round(Y[k.r] * P)) + 'px; width: ' + (Math.round(k.w * P) - GAP) + 'px; height: ' + (Math.round(k.h * P) - GAP) + 'px; border-radius: 3px; background: ' + caps[k.r] + '; box-shadow: 0 0 0 1px color-mix(in srgb, ' + c + ' 80%, transparent), 0 2px 5px color-mix(in srgb, ' + c + ' 60%, transparent), inset 0 -2px 0 rgba(0,0,0,0.2)'
      };
    });
    const cw = PAD * 2 + Math.round(W * P) - GAP, ch = PAD * 2 + Math.round(6.3 * P) - GAP;
    const kd = Math.round(1.3 * P);
    return {
      keys,
      caseStyle: 'position: relative; width: ' + cw + 'px; height: ' + ch + 'px; border-radius: 10px; background: linear-gradient(180deg, #24272B, #15171A); box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 10px 24px rgba(31,35,40,0.28)',
      ledStyle: 'position: absolute; left: ' + (PAD + Math.round(1.3 * P)) + 'px; top: ' + (PAD + 4) + 'px; width: 3px; height: ' + (P - GAP - 8) + 'px; border-radius: 2px; background: #C9B8FF; box-shadow: 0 0 6px #C9B8FF',
      knob: {
        style: 'position: absolute; display: block; left: ' + (PAD + Math.round((NUM + 2.4) * P)) + 'px; top: ' + (PAD - 4) + 'px; width: ' + kd + 'px; height: ' + kd + 'px; border-radius: 50%; background: conic-gradient(from 200deg, #F2F3F1, #9DA1A3, #E8E9E6, #8C9093, #F2F3F1); box-shadow: 0 2px 5px rgba(0,0,0,0.5)',
        inner: 'display: block; margin: 4px; height: ' + (kd - 8) + 'px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #3A3E42, #121416)'
      }
    };
  }
}
