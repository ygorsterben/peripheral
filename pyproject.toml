[project]
name = "gerenciador-de-perifericos"
version = "1.0.0b2"  # build beta 1.0, segunda versão
description = "Configura o teclado Aula F99 Pro e o mouse Fire Phoenix BK-R6X no Windows 11"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "hidapi==0.15.0",
    "pywebview==6.2.1",
    "pystray==0.19.5",
    "pillow==13.0.0",
]

[project.optional-dependencies]
dev = ["pyinstaller==6.22.3"]
